name: Verify native player lifetime

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  player:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Bootstrap verified native runtime
        shell: pwsh
        run: ./windows/scripts/windows.ps1 bootstrap
      - name: Verify regression detects the former missing owner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $env:SIDEB_MPV_DIR = Join-Path $PWD 'windows/.cache/mpv'
          $env:PATH = "$env:SIDEB_MPV_DIR;$env:PATH"
          $stage = Join-Path $env:RUNNER_TEMP 'player-before-lifetime-fix'
          New-Item -ItemType Directory -Path "$stage/crates/player/src" -Force | Out-Null
          Copy-Item core/Cargo.toml,core/Cargo.lock -Destination $stage
          Copy-Item core/crates/player/Cargo.toml,core/crates/player/build.rs -Destination "$stage/crates/player"
          Copy-Item core/crates/player/examples -Destination "$stage/crates/player/examples" -Recurse
          $workspace = [IO.File]::ReadAllText("$stage/Cargo.toml")
          $workspace = [regex]::Replace($workspace, '(?s)members\s*=\s*\[.*?\]', 'members = ["crates/player"]', 1)
          [IO.File]::WriteAllText("$stage/Cargo.toml", $workspace)
          $source = [IO.File]::ReadAllText('core/crates/player/src/lib.rs').Replace("`r`n", "`n")
          $source = $source.Replace('let event_mpv = Arc::clone(&mpv);', '')
          $source = $source.Replace('let _keep_alive = event_mpv;', '')
          $source = $source.Replace("        if tx.is_closed() {`n            break;`n        }", '')
          [IO.File]::WriteAllText("$stage/crates/player/src/lib.rs", $source)
          $baselineOutput = @(& cargo test --manifest-path "$stage/Cargo.toml" -p player native_handle_outlives_player_until_event_receiver_closes -- --nocapture 2>&1)
          $baseline = $LASTEXITCODE
          $baselineOutput | ForEach-Object { Write-Host $_ }
          Write-Host "FORMER_LIFETIME_REGRESSION_EXIT=$baseline"
          if ($baseline -eq 0) { throw 'The regression failed to detect the missing native owner' }
          $details = $baselineOutput | Out-String
          if ($details -notmatch 'running 1 test' -or $details -notmatch 'live event stream must retain|STATUS_ACCESS_VIOLATION') { throw 'Unexpected baseline failure; lifetime regression was not demonstrated' }
          # This step expects the old copy to fail. GitHub's pwsh wrapper otherwise
          # propagates the last native exit code after the validated negative probe.
          exit 0
      - name: Verify production player and repeated native teardown
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:SIDEB_MPV_DIR = Join-Path $PWD 'windows/.cache/mpv'
          $env:PATH = "$env:SIDEB_MPV_DIR;$env:PATH"
          & cargo test --locked --manifest-path core/Cargo.toml -p player
          if ($LASTEXITCODE -ne 0) { throw 'Production player tests failed' }
          for ($iteration = 1; $iteration -le 20; $iteration++) {
            & cargo test --locked --manifest-path core/Cargo.toml -p player
            if ($LASTEXITCODE -ne 0) { throw "Production player failed repetition $iteration" }
          }
          Write-Host 'PRODUCTION_PLAYER_REPETITIONS_PASSED=20'
