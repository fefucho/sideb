name: macOS CI

on:
  push:
    paths:
      - 'core/**'
      - 'apple/**'
      - 'Scripts/**'
      - 'extensions/**'
      - '.github/workflows/macos.yml'
  pull_request:
    paths:
      - 'core/**'
      - 'apple/**'
      - 'Scripts/**'
      - 'extensions/**'
      - '.github/workflows/macos.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    # The current macOS app already uses macOS 27 APIs. This arm64 image supplies
    # that SDK; deployment remains macOS 15 as declared by Package.swift.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            core/target/
            extensions/spotify-canvas/target/
          key: macos-core-${{ hashFiles('core/Cargo.lock', 'extensions/spotify-canvas/Cargo.lock') }}
      - name: Test default shared core
        run: cargo test --locked --manifest-path core/Cargo.toml -p innertube -p sideb-core
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test optional Spotify Canvas provider (macOS arm64)
        working-directory: extensions/spotify-canvas
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo build --release --locked --target aarch64-apple-darwin
      - name: Test provider packaging and release checks
        run: node --test Scripts/package-visual-provider.test.mjs Scripts/release-config.test.mjs
      - name: Rebuild XCFramework and Swift bindings from this revision
        working-directory: apple
        run: bash build_xcframework.sh
      - name: Test and compile macOS app
        run: swift test --package-path apple --no-parallel
