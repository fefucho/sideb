[package]
name = "automix-lab"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
anyhow = "1.0.104"
automix = { version = "0.1.0", path = "../../core/crates/automix" }
clap = { version = "4.6.7", features = ["derive"] }
innertube = { version = "0.1.0", path = "../../core/crates/innertube" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }

# Standalone experiment: deliberately not a member of core/'s workspace.
[workspace]

[profile.dev]
opt-level = 2
