[package]
name = "automix-lab"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
hound = "3.5.1"
innertube = { version = "0.1.0", path = "../../core/crates/innertube" }
realfft = "3.5.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
signalsmith-stretch = "0.1.3"
stem-splitter-core = "1.2.0"
symphonia = { version = "0.5", features = ["aac", "isomp4", "mp3", "wav", "flac", "ogg", "vorbis", "alac"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }

# Standalone experiment: deliberately not a member of core/'s workspace.
[workspace]

[profile.dev]
opt-level = 2
