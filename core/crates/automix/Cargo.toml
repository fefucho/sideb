[package]
name = "automix"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Side B automix - beat-matched, stem-aware transitions between songs, rendered offline"

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
hound = "3.5.1"
realfft = "3.5.1"
signalsmith-stretch = "0.1.3"
directories = "5"
ort = { version = "=2.0.0-rc.11", features = ["download-binaries"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rustfft = "6"
sha2 = "0.10"
symphonia = { version = "0.5", features = ["aac", "isomp4", "mp3", "wav", "flac", "ogg", "vorbis", "alac"] }

# Apple silicon runs the model on the GPU / Neural Engine through CoreML; on
# Windows DirectML does, with the CPU as the fallback everywhere.
[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.11", features = ["download-binaries", "coreml"] }

[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "=2.0.0-rc.11", features = ["download-binaries", "directml"] }
